<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtmosTrack — Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-dark: #0a0e1a;
    --sky-mid: #0d1b3e;
    --sky-blue: #1a3a6e;
    --sky-accent: #4a9eff;
    --sky-glow: #7bc4ff;
    --cloud: rgba(255,255,255,0.08);
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text-primary: #f0f6ff;
    --text-secondary: rgba(180,210,255,0.7);
    --text-muted: rgba(140,180,230,0.5);
    --warm: #ffaa44;
    --hot: #ff6644;
    --cold: #88ccff;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sky-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated sky background */
  .sky-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, #1a3a6e 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, #0d2040 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #0a0e1a 0%, #050810 100%);
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: var(--base-op, 0.6);
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--base-op, 0.6); transform: scale(1); }
    50% { opacity: 0.1; transform: scale(0.6); }
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    animation: floatOrb 8s ease-in-out infinite;
    z-index: 0;
  }
  .orb-1 { width: 400px; height: 400px; background: rgba(74,158,255,0.08); top: -100px; left: -100px; animation-delay: 0s; }
  .orb-2 { width: 300px; height: 300px; background: rgba(100,80,255,0.06); bottom: -50px; right: -50px; animation-delay: 3s; }

  @keyframes floatOrb {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 20px); }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--sky-accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--sky-accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px var(--sky-accent); transform: scale(1); }
    50% { box-shadow: 0 0 20px var(--sky-accent), 0 0 40px rgba(74,158,255,0.3); transform: scale(1.2); }
  }

  .header-tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    border: 1px solid var(--glass-border);
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--glass);
  }

  /* Search */
  .search-wrap {
    display: flex;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .search-input {
    flex: 1;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(10px);
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: var(--sky-accent);
    background: rgba(74,158,255,0.08);
  }

  .search-btn {
    background: var(--sky-accent);
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .search-btn:hover { background: var(--sky-glow); transform: translateY(-1px); }
  .search-btn:active { transform: translateY(0); }

  .locate-btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 18px;
    backdrop-filter: blur(10px);
  }
  .locate-btn:hover { border-color: var(--sky-accent); color: var(--sky-accent); }

  /* Main card */
  .main-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 2.5rem;
    backdrop-filter: blur(20px);
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
    animation: fadeSlide 0.6s ease-out;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  .city-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .city-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .city-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 300;
  }

  .local-time {
    text-align: right;
    font-size: 13px;
    color: var(--text-muted);
  }

  .local-time span {
    display: block;
    font-family: 'Syne', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-top: 2px;
  }

  .temp-section {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .weather-icon {
    font-size: 5rem;
    line-height: 1;
    filter: drop-shadow(0 0 20px rgba(255,200,100,0.3));
    animation: sway 4s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .temp-main {
    font-family: 'Syne', sans-serif;
    font-size: clamp(4rem, 10vw, 6.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #f0f6ff 0%, #7bc4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .temp-right {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .condition-text {
    font-size: 1.1rem;
    font-weight: 300;
    font-style: italic;
    color: var(--text-secondary);
  }

  .feels-like {
    font-size: 13px;
    color: var(--text-muted);
  }

  .unit-toggle {
    display: inline-flex;
    background: var(--cloud);
    border-radius: 8px;
    padding: 3px;
    margin-top: 4px;
    width: fit-content;
  }

  .unit-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .unit-btn.active {
    background: var(--sky-accent);
    color: white;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--glass-border);
  }

  .stat-item {
    background: var(--cloud);
    border-radius: 16px;
    padding: 1rem 1.2rem;
    transition: background 0.2s;
  }

  .stat-item:hover { background: rgba(255,255,255,0.1); }

  .stat-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .stat-icon {
    font-size: 1.2rem;
    margin-bottom: 6px;
    display: block;
  }

  /* Forecast cards */
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .forecast-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 600px) { .forecast-row { grid-template-columns: repeat(3, 1fr); } }

  .forecast-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 1rem 0.8rem;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
    animation: fadeSlide 0.6s ease-out both;
  }

  .forecast-card:hover {
    border-color: var(--sky-accent);
    background: rgba(74,158,255,0.08);
    transform: translateY(-3px);
  }

  .forecast-day {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .forecast-icon { font-size: 1.8rem; margin-bottom: 8px; }

  .forecast-temps {
    display: flex;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
  }

  .forecast-high {
    font-weight: 600;
    color: var(--text-primary);
  }

  .forecast-low { color: var(--text-muted); }

  /* Hourly */
  .hourly-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 1.5rem;
    scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar { display: none; }

  .hour-card {
    flex-shrink: 0;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 14px;
    text-align: center;
    backdrop-filter: blur(10px);
    min-width: 70px;
    transition: all 0.2s;
  }

  .hour-card:hover {
    border-color: var(--sky-accent);
    background: rgba(74,158,255,0.08);
  }

  .hour-card.now {
    border-color: var(--sky-accent);
    background: rgba(74,158,255,0.12);
  }

  .hour-time { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  .hour-icon { font-size: 1.4rem; margin-bottom: 6px; }
  .hour-temp { font-size: 14px; font-weight: 600; color: var(--text-primary); }

  /* Air quality */
  .aqi-bar-wrap {
    height: 6px;
    background: var(--cloud);
    border-radius: 100px;
    overflow: hidden;
    margin: 8px 0;
  }

  .aqi-bar {
    height: 100%;
    border-radius: 100px;
    transition: width 1s ease-out;
  }

  /* Loading & Error */
  .loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }

  .spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--sky-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    text-align: center;
    padding: 2rem;
    color: #ff8888;
    background: rgba(255,80,80,0.08);
    border: 1px solid rgba(255,80,80,0.15);
    border-radius: 16px;
    margin-bottom: 1rem;
  }

  .welcome {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }

  .welcome-icon { font-size: 5rem; margin-bottom: 1rem; }

  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 0.5rem;
  }

  .welcome p {
    font-size: 14px;
    font-weight: 300;
    max-width: 300px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .quick-cities {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1.5rem;
  }

  .quick-city {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .quick-city:hover {
    border-color: var(--sky-accent);
    color: var(--sky-accent);
    background: rgba(74,158,255,0.08);
  }

  /* UV index bar */
  .uv-bar {
    height: 4px;
    border-radius: 100px;
    background: linear-gradient(90deg, #88cc66, #ffcc00, #ff8800, #cc2200);
    margin: 8px 0 4px;
    position: relative;
  }

  .uv-pointer {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: white;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    transition: left 1s ease-out;
  }

  .bottom-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 500px) { .bottom-info { grid-template-columns: 1fr; } }

  .info-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 1.2rem 1.4rem;
    backdrop-filter: blur(10px);
  }

  .info-card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .sun-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .sun-label { font-size: 12px; color: var(--text-muted); }
  .sun-val { font-size: 15px; font-weight: 600; color: var(--text-primary); }

  .footer {
    margin-top: 3rem;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .footer a {
    color: var(--sky-accent);
    text-decoration: none;
  }

  .footer a:hover { text-decoration: underline; }

  /* Alerts */
  .alert-banner {
    background: rgba(255, 160, 50, 0.1);
    border: 1px solid rgba(255, 160, 50, 0.25);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #ffcc88;
  }
</style>
</head>
<body>

<div class="sky-bg"></div>
<div class="stars" id="stars"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      AtmosTrack
    </div>
    <div class="header-tag">Weather Dashboard</div>
  </header>

  <div class="search-wrap">
    <input class="search-input" id="cityInput" type="text" placeholder="Search city, country..." autocomplete="off">
    <button class="locate-btn" id="locateBtn" title="Use my location">📍</button>
    <button class="search-btn" id="searchBtn">Search →</button>
  </div>

  <div id="alertBanner" style="display:none" class="alert-banner">
    <span>⚠️</span>
    <span id="alertText"></span>
  </div>

  <div id="content"></div>

  <footer class="footer">
    Built with <a href="https://open-meteo.com" target="_blank">Open-Meteo API</a> · No API key needed · Portfolio project
  </footer>
</div>

<script>
const STARS_COUNT = 80;
const starsEl = document.getElementById('stars');
for (let i = 0; i < STARS_COUNT; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2 + 0.5;
  s.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%; top:${Math.random()*100}%;
    --dur:${2+Math.random()*4}s;
    --delay:${Math.random()*5}s;
    --base-op:${0.3+Math.random()*0.5};
  `;
  starsEl.appendChild(s);
}

const ICONS = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌧️',
  61:'🌧️', 63:'🌧️', 65:'🌧️',
  71:'🌨️', 73:'❄️', 75:'❄️',
  77:'🌨️',
  80:'🌦️', 81:'🌧️', 82:'⛈️',
  85:'🌨️', 86:'❄️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};

const CONDITIONS = {
  0:'Clear Sky', 1:'Mainly Clear', 2:'Partly Cloudy', 3:'Overcast',
  45:'Foggy', 48:'Icy Fog',
  51:'Light Drizzle', 53:'Drizzle', 55:'Heavy Drizzle',
  61:'Slight Rain', 63:'Moderate Rain', 65:'Heavy Rain',
  71:'Slight Snow', 73:'Moderate Snow', 75:'Heavy Snow',
  77:'Snow Grains',
  80:'Light Showers', 81:'Showers', 82:'Heavy Showers',
  85:'Snow Showers', 86:'Heavy Snow Showers',
  95:'Thunderstorm', 96:'Thunderstorm w/ Hail', 99:'Heavy Thunderstorm'
};

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let useCelsius = true;

function toF(c) { return (c * 9/5 + 32).toFixed(0); }
function dispTemp(c) { return useCelsius ? Math.round(c) + '°C' : toF(c) + '°F'; }

function formatTime12(dateStr) {
  const d = new Date(dateStr);
  let h = d.getHours(), m = d.getMinutes(), ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

async function geocode(city) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
  const d = await r.json();
  if (!d.results || !d.results.length) throw new Error('City not found. Try another name.');
  return d.results[0];
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,uv_index,surface_pressure,precipitation,visibility&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,uv_index_max&wind_speed_unit=kmh&forecast_days=5&timezone=auto`;
  const r = await fetch(url);
  const d = await r.json();
  return d;
}

async function reverseGeocode(lat, lon) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=&count=1&language=en&format=json&latitude=${lat}&longitude=${lon}`);
  return { name: 'Current Location', country: '', admin1: '' };
}

function getAQIColor(val) {
  if (val < 33) return '#66cc66';
  if (val < 66) return '#ffcc00';
  return '#ff6644';
}

function getUVLabel(uv) {
  if (uv < 3) return 'Low';
  if (uv < 6) return 'Moderate';
  if (uv < 8) return 'High';
  if (uv < 11) return 'Very High';
  return 'Extreme';
}

function getWindDir(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

function getHumidityLabel(h) {
  if (h < 30) return 'Dry';
  if (h < 60) return 'Comfortable';
  if (h < 80) return 'Humid';
  return 'Very Humid';
}

let currentLat, currentLon, currentCity;

async function loadWeather(lat, lon, cityInfo) {
  currentLat = lat; currentLon = lon; currentCity = cityInfo;
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading"><div class="spinner"></div><p>Fetching atmosphere data…</p></div>`;

  try {
    const wx = await fetchWeather(lat, lon);
    const cur = wx.current;
    const daily = wx.daily;
    const hourly = wx.hourly;

    const now = new Date();
    const hours = now.getHours();
    const cityName = cityInfo.name || 'Unknown';
    const country = cityInfo.country || '';
    const region = cityInfo.admin1 ? `, ${cityInfo.admin1}` : '';
    const timeStr = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
    const dateStr = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    const wcode = cur.weather_code;
    const icon = ICONS[wcode] || '🌡️';
    const condition = CONDITIONS[wcode] || 'Unknown';

    // Hourly data — next 12 hours
    const hourlyItems = [];
    const nowHourIndex = hourly.time.findIndex(t => t.startsWith(now.toISOString().slice(0,13)));
    const startIdx = nowHourIndex >= 0 ? nowHourIndex : 0;
    for (let i = startIdx; i < startIdx + 12 && i < hourly.time.length; i++) {
      const t = new Date(hourly.time[i]);
      hourlyItems.push({
        time: i === startIdx ? 'Now' : t.toLocaleTimeString('en-US',{hour:'numeric',hour12:true}),
        icon: ICONS[hourly.weather_code[i]] || '🌡️',
        temp: hourly.temperature_2m[i],
        isNow: i === startIdx
      });
    }

    // Build HTML
    const uv = cur.uv_index || 0;
    const uvPct = Math.min((uv / 11) * 100, 100).toFixed(0);
    const humidity = cur.relative_humidity_2m;
    const wind = cur.wind_speed_10m;
    const windDir = getWindDir(cur.wind_direction_10m || 0);
    const pressure = cur.surface_pressure ? Math.round(cur.surface_pressure) : '--';
    const visibility = cur.visibility ? (cur.visibility / 1000).toFixed(1) : '--';

    const sunriseTime = daily.sunrise ? formatTime12(daily.sunrise[0]) : '--';
    const sunsetTime = daily.sunset ? formatTime12(daily.sunset[0]) : '--';

    const forecastHTML = daily.time.map((d, i) => {
      const date = new Date(d + 'T12:00:00');
      const dayLabel = i === 0 ? 'Today' : DAYS[date.getDay()];
      return `
        <div class="forecast-card" style="animation-delay:${i*0.08}s">
          <div class="forecast-day">${dayLabel}</div>
          <div class="forecast-icon">${ICONS[daily.weather_code[i]] || '🌡️'}</div>
          <div class="forecast-temps">
            <span class="forecast-high">${dispTemp(daily.temperature_2m_max[i])}</span>
            <span class="forecast-low">${dispTemp(daily.temperature_2m_min[i])}</span>
          </div>
        </div>
      `;
    }).join('');

    const hourlyHTML = hourlyItems.map(h => `
      <div class="hour-card ${h.isNow ? 'now' : ''}">
        <div class="hour-time">${h.time}</div>
        <div class="hour-icon">${h.icon}</div>
        <div class="hour-temp">${dispTemp(h.temp)}</div>
      </div>
    `).join('');

    content.innerHTML = `
      <div class="main-card">
        <div class="city-row">
          <div>
            <div class="city-name">${cityName}</div>
            <div class="city-meta">${country}${region} · ${dateStr}</div>
          </div>
          <div class="local-time">
            Local time
            <span>${timeStr}</span>
          </div>
        </div>

        <div class="temp-section">
          <div class="weather-icon">${icon}</div>
          <div>
            <div class="temp-main" id="mainTemp">${dispTemp(cur.temperature_2m)}</div>
          </div>
          <div class="temp-right">
            <div class="condition-text">${condition}</div>
            <div class="feels-like" id="feelsLike">Feels like ${dispTemp(cur.apparent_temperature)}</div>
            <div class="unit-toggle">
              <button class="unit-btn ${useCelsius?'active':''}" id="btnC" onclick="switchUnit(true)">°C</button>
              <button class="unit-btn ${!useCelsius?'active':''}" id="btnF" onclick="switchUnit(false)">°F</button>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-icon">💧</span>
            <div class="stat-label">Humidity</div>
            <div class="stat-value">${humidity}%</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${getHumidityLabel(humidity)}</div>
          </div>
          <div class="stat-item">
            <span class="stat-icon">💨</span>
            <div class="stat-label">Wind</div>
            <div class="stat-value">${wind} km/h</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${windDir}</div>
          </div>
          <div class="stat-item">
            <span class="stat-icon">☀️</span>
            <div class="stat-label">UV Index</div>
            <div class="stat-value">${uv.toFixed(0)}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${getUVLabel(uv)}</div>
          </div>
          <div class="stat-item">
            <span class="stat-icon">🔵</span>
            <div class="stat-label">Pressure</div>
            <div class="stat-value">${pressure}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">hPa</div>
          </div>
          <div class="stat-item">
            <span class="stat-icon">👁️</span>
            <div class="stat-label">Visibility</div>
            <div class="stat-value">${visibility}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">km</div>
          </div>
        </div>
      </div>

      <div class="section-title">Hourly Forecast</div>
      <div class="hourly-scroll">${hourlyHTML}</div>

      <div class="section-title">5-Day Forecast</div>
      <div class="forecast-row">${forecastHTML}</div>

      <div class="bottom-info">
        <div class="info-card">
          <div class="info-card-title">🌅 Sun Schedule</div>
          <div class="sun-row">
            <span class="sun-label">Sunrise</span>
            <span class="sun-val">🌅 ${sunriseTime}</span>
          </div>
          <div class="sun-row">
            <span class="sun-label">Sunset</span>
            <span class="sun-val">🌇 ${sunsetTime}</span>
          </div>
        </div>
        <div class="info-card">
          <div class="info-card-title">☀️ UV Index</div>
          <div class="uv-bar">
            <div class="uv-pointer" style="left:${uvPct}%"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px">
            <span>Low</span><span>Moderate</span><span>High</span><span>Extreme</span>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:10px">
            Today's max: <strong style="color:var(--text-primary)">${daily.uv_index_max ? daily.uv_index_max[0].toFixed(0) : '--'}</strong> · ${getUVLabel(daily.uv_index_max ? daily.uv_index_max[0] : 0)}
          </div>
        </div>
      </div>
    `;

    // Store for unit switching
    window._wxData = { cur, daily };

  } catch (err) {
    content.innerHTML = `<div class="error-msg">⚠️ ${err.message}</div>` + getWelcomeHTML();
  }
}

window.switchUnit = function(celsius) {
  useCelsius = celsius;
  document.getElementById('btnC').classList.toggle('active', celsius);
  document.getElementById('btnF').classList.toggle('active', !celsius);
  if (currentLat) loadWeather(currentLat, currentLon, currentCity);
};

window.quickSearch = function(city) {
  document.getElementById('cityInput').value = city;
  doSearch();
};

async function doSearch() {
  const city = document.getElementById('cityInput').value.trim();
  if (!city) return;
  document.getElementById('content').innerHTML = `<div class="loading"><div class="spinner"></div><p>Locating ${city}…</p></div>`;
  try {
    const info = await geocode(city);
    await loadWeather(info.latitude, info.longitude, info);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="error-msg">⚠️ ${err.message}</div>` + getWelcomeHTML();
  }
}

function getWelcomeHTML() {
  return `
    <div class="welcome">
      <div class="welcome-icon">🌍</div>
      <h2>Explore the weather</h2>
      <p>Search any city in the world to see real-time conditions and forecasts</p>
      <div class="quick-cities">
        <div class="quick-city" onclick="quickSearch('Tashkent')">🇺🇿 Tashkent</div>
        <div class="quick-city" onclick="quickSearch('London')">🇬🇧 London</div>
        <div class="quick-city" onclick="quickSearch('New York')">🗽 New York</div>
        <div class="quick-city" onclick="quickSearch('Tokyo')">🇯🇵 Tokyo</div>
        <div class="quick-city" onclick="quickSearch('Dubai')">🇦🇪 Dubai</div>
        <div class="quick-city" onclick="quickSearch('Paris')">🇫🇷 Paris</div>
      </div>
    </div>
  `;
}

document.getElementById('cityInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

document.getElementById('searchBtn').addEventListener('click', doSearch);

document.getElementById('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  document.getElementById('content').innerHTML = `<div class="loading"><div class="spinner"></div><p>Getting your location…</p></div>`;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=&count=1&language=en&format=json`);
    await loadWeather(lat, lon, { name: 'My Location', country: '', admin1: '' });
  }, () => {
    document.getElementById('content').innerHTML = `<div class="error-msg">⚠️ Location access denied. Please search manually.</div>` + getWelcomeHTML();
  });
});

// Initial welcome
document.getElementById('content').innerHTML = getWelcomeHTML();

// Auto-load Tashkent
window.onload = () => quickSearch('Tashkent');
</script>
</body>
</html>
